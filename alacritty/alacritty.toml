[general]
import = [
    "theme.toml",
]

[colors.bright]
yellow  = "#ffcc00"

[font]
size = 13
# normal = { family = "Berkeley Mono Variable" }
# normal = { family = "Liberation Mono" }
# normal = { family = "Monaco" }
# normal = { family = "Envy Code R" }
normal = { family = "Lilex" }

[font.offset]
# y = -3

[window]
#decorations = "none"
padding = { x = 4, y = 0 }
option_as_alt = "Both"
#opacity = 0.97

[mouse]
hide_when_typing = false

[keyboard]
bindings = [
    { key = "[", mods = "Control", mode = "Vi", action = "ToggleViMode" },
]
